name: Go
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Cache driver and browsers
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\patchright-go
            ~\AppData\Local\ms-playwright
          key: windows-patchright-${{ hashFiles('**/run.go') }}
      - name: Install Chromium
        run: go run ./cmd/patchright install chromium
      - name: Test
        run: go test -timeout 30m ./...
        env:
          BROWSER: chromium
