name: Go
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        go: ["stable"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: Cache drivers
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/patchright-go
            ~/Library/Caches/patchright-go
            ~\AppData\Local\patchright-go
          key: ${{ runner.os }}-patchright-${{ hashFiles('**/run.go') }}
      - run: go test ./...
        env:
          BROWSER: chromium
