name: Go
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Cache driver and browsers
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\patchright-go
            ~\AppData\Local\ms-playwright
          key: windows-patchright-${{ hashFiles('**/run.go') }}
      - name: Install Chromium
        run: go run ./cmd/patchright install chromium
      - name: Unit tests
        shell: pwsh
        run: |
          $pkgs = go list ./... | Where-Object { $_ -notmatch '/tests$' }
          go test -timeout 10m @pkgs
        env:
          BROWSER: chromium
      - name: Chromium smoke
        run: go test -timeout 8m ./tests -count=1 -run "^(TestPageURL|TestPageEvaluate|TestPageScreenshot|TestPageTitle|TestPageSetContent)$"
        env:
          BROWSER: chromium
